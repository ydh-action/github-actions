name: test-local
on: 
  push:
    branches: [dev]
    
jobs:
  test:
    if: github.repository == 'ydh-action/github-actions'
    runs-on: ubuntu-latest
    steps:
    - name: checout the code
      uses: actions/checkout@v4
  
  docker-login: 
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: docker login
      run: |
        docker login docker.io
        $DOCKER_USERNAME
        $DOCKER_PASSWD

