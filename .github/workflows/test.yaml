name: test-local
on: 
  push:
    branches: [dev]
    
jobs:
  test:
    if: github.repository == 'ydh-action/github-actions'
    runs-on: ubuntu-latest
    steps:
    - name: checout the code
      uses: actions/checkout@v4
  
  image-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps: 
    - name: docker build
      run: | 
        docker login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWD }}
        docker pull dockerydh/custom-ubuntu:yoon
  
  deploy: 
    runs-on: ubuntu-latest
    needs: [image-build]
    steps: 
    - name: image deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.CINAMON_HOST }}
        username: ${{ secrets.CINAMON_USERNAME }}
        key: ${{ secrets.CINAMON_SERVERKEY }}
        password: ${{ secrets.CINAMON_PASSWD }}
        port: 22   
    - name: Add SSH known hosts
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.CINAMON_SERVERKEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Scanning host: ${{ secrets.CINAMON_HOST }}"
        ssh-keyscan -H ${{ secrets.CINAMON_HOST }} >> ~/.ssh/known_hosts
        echo "Known hosts after scanning:"
        cat ~/.ssh/known_hosts
        docker run custom-ubuntu:yoon          

  
        