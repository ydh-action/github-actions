name: test-local
on: 
  push:
    branches: [dev]
    
jobs:
  test:
    if: github.repository == 'ydh-action/github-actions'
    runs-on: ubuntu-latest
    steps:
    - name: checout the code
      uses: actions/checkout@v4
  
  image-build:
    runs-on: self-hosted
    needs: [test]
    steps: 
    - name: docker build
      run: | 
        docker login docker.io
        $DOCKERHUB_USERNAME
        $DOCKERHUB_PASSWD
        docker pull dockerydh/custom-ubuntu:yoon
  
        