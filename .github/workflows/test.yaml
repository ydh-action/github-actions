name: test-local
on: 
  push:
    branches: [dev]
    
jobs:
  test:
    if: github.repository == 'ydh-action/github-actions'
    runs-on: ubuntu-latest
    steps:
    - name: checout the code
      uses: actions/checkout@v4
  
  image-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps: 
    - name: docker build
      run: | 
        docker login docker.io
        ${{ secrets.$DOCKERHUB_USERNAME }}
        ${{ secrets.$DOCKERHUB_PASSWD }}
        docker pull dockerydh/custom-ubuntu:yoon
  
  deploy: 
    runs-on: ubuntu-latest
    needs: [image-build]
    stpes: 
    - name: image deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.CINAMON_HOST }}
        username: ${{ secrets.cinamonydh }}
        password: ${{ secrets.CINAMON_PASSWD }}
        port: 22
        script: | 
          docker run custom-ubuntu:yoon

  
        