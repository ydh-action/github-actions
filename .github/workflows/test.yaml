name: test-local
on: 
  push:
    branches: [dev]
    
jobs:
  test:
    if: github.repository == 'ydh-action/github-actions'
    runs-on: ubuntu-latest
    steps:
    - name: checout the code
      uses: actions/checkout@v4
  
  state-check: 
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: docker state
      run: |
        sudo docker ps 
